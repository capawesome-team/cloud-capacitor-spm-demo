name: Capawesome

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  NODE_VERSION: 24

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build Android
        id: build
        uses: capawesome-team/cloud-build-action@v0.1.1
        with:
          appId: ${{ secrets.CAPAWESOME_CLOUD_APP_ID }}
          gitRef: ${{ github.event.pull_request.head.sha || github.sha }}
          platform: 'android'
          share: true
          shareExpiresInDays: 30
          token: ${{ secrets.CAPAWESOME_CLOUD_TOKEN }}
          type: 'debug'
      - name: Comment share link
        if: steps.build.outputs.shareUrl != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body =
              `📱 **Android build \`#${{ steps.build.outputs.buildNumber }}\` ready to test**\n\n` +
              `![QR code](${{ steps.build.outputs.shareQrCodeUrl }})\n\n` +
              `Scan the QR code or open the [share page](${{ steps.build.outputs.shareUrl }}) to install the build on your device. ` +
              `The link expires in 30 days.`;
            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body,
              });
            }

  build-ios:
    name: Build iOS
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build iOS
        uses: capawesome-team/cloud-build-action@v0.1.1
        with:
          appId: ${{ secrets.CAPAWESOME_CLOUD_APP_ID }}
          gitRef: ${{ github.event.pull_request.head.sha || github.sha }}
          platform: 'ios'
          token: ${{ secrets.CAPAWESOME_CLOUD_TOKEN }}
          type: 'simulator'
